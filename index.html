<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRZ play · Painel do conselho</title>
<!-- Página de CONSULTA. Usa só a chave publicável do projeto (pública por definição).
     O que cada usuário vê é decidido no banco (Row Level Security): conselho = só o próprio condomínio; diretoria = carteira.
     Nenhuma gravação é feita além do registro de acesso. -->
<style>
@font-face{font-family:Branding;src:url(assets/fontes/Branding-Light.ttf);font-weight:300}@font-face{font-family:Branding;src:url(assets/fontes/Branding-Medium.ttf);font-weight:400 500}@font-face{font-family:Branding;src:url(assets/fontes/Branding-Bold.ttf);font-weight:600 800}
/* Identidade visual FRZ play: #00405A petróleo · #A5A3A2 cinza · #473D52 ameixa · fonte Branding. Verde/amarelo/vermelho só como sinal de situação. */
:root{--ink:#1E2A33;--mut:#5F6B73;--line:rgba(165,163,162,.45);--pri:#00405A;--cin:#A5A3A2;--ame:#473D52;--pos:#14916A;--neg:#CF3F5B;--warn:#B97A0B}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Branding,Inter,system-ui,Arial,sans-serif;background:#F5F5F4;color:var(--ink);font-size:14px}
header{background:var(--ame);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}header img{height:46px}
main{max-width:1180px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kl{font-size:12px;color:var(--ame);font-weight:500}.kv{font-size:22px;font-weight:700;margin:5px 0 2px;color:var(--pri)}.ks{font-size:12px;color:var(--mut)}h2{font-size:16px;margin-bottom:8px;color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:10.5px;text-transform:uppercase;color:var(--ame);text-align:left;padding:7px;border-bottom:1px solid var(--line);background:rgba(0,64,90,.06)}td{padding:7px;border-bottom:1px solid rgba(165,163,162,.25)}.r{text-align:right}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}.ok{background:#E5F5EE;color:var(--pos)}.bad{background:#FCE9ED;color:var(--neg)}.wa{background:#FDF3DE;color:var(--warn)}.in{background:rgba(0,64,90,.10);color:var(--pri)}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 11px}button{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600;cursor:pointer}
.login{max-width:380px;margin:60px auto}.login input{width:100%;margin-top:8px}.hint{font-size:12px;color:var(--mut)}.neg{color:var(--neg)}.pos{color:var(--pos)}
footer{background:var(--ame);color:#E4E1E8;font-size:12px;text-align:center;padding:12px}
@media(max-width:800px){.g4,.g3{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><img src="assets/play_principal_texto_branco.png" alt="FRZ play"><div style="text-align:right"><div style="font-weight:600">Painel do conselho</div><div id="who" class="hint" style="color:#E4E1E8"></div></div></header>
<main id="app"></main><footer>FRZ play · Administração de condomínios · grupofrz.com.br · somente consulta</footer>
<script>
const CFG={url:'https://cjpyqxxpfnldowrppudd.supabase.co',chave:'sb_publishable_zRAmTJg7IDJoNb-VUZvcrA_7uM0h9lh'};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m2=v=>v==null?'–':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);const pc=v=>v==null||!isFinite(v)?'–':(v*100).toFixed(1).replace('.',',')+'%';
let TOK=null,EMAIL='',ROWS=[],CONDOS={},SEL=null;
function login(){$('app').innerHTML=`<div class="card login"><h2>Acesso do conselho</h2><div class="hint">Use o e-mail e a senha cadastrados pela FRZ. Somente consulta.</div><input id="e" placeholder="e-mail" autocomplete="username"><input id="s" type="password" placeholder="senha" autocomplete="current-password"><button style="width:100%;margin-top:12px" onclick="entrar()">Entrar</button><div id="err" class="hint neg" style="margin-top:8px"></div></div>`}
async function api(p,o){o=o||{};const r=await fetch(CFG.url+p,{...o,headers:{apikey:CFG.chave,...(TOK?{Authorization:'Bearer '+TOK}:{}),'Content-Type':'application/json',...(o.headers||{})}});const j=r.status===204?null:await r.json().catch(()=>null);if(!r.ok)throw (j&&(j.message||j.error_description||j.msg))||('HTTP '+r.status);return j}
async function entrar(){try{const j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('e').value.trim(),password:$('s').value})});TOK=j.access_token;EMAIL=j.user&&j.user.email;await carregar()}catch(e){$('err').textContent='Não foi possível entrar: '+e}}
async function carregar(){const [rows,cs]=await Promise.all([api('/rest/v1/painel_conselho?select=*'),api('/rest/v1/condominios?select=id,nome')]);ROWS=rows;cs.forEach(c=>CONDOS[c.id]=c.nome);
  api('/rest/v1/acessos',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({email:EMAIL,acao:'consulta painel do conselho',origem:'painel_conselho'})}).catch(()=>{});
  $('who').innerHTML=esc(EMAIL)+' · <a style="color:#fff;cursor:pointer" onclick="TOK=null;login();$(\'who\').textContent=\'\'">sair</a>';SEL=Object.keys(CONDOS)[0];tela()}
const get=(c,t)=>{const x=ROWS.find(r=>r.condo===c&&r.tipo===t);return x?x:null};
const pcm=v=>v==null?'–':v;
const st={estouro:['Estouro','bad'],atencao:['Atenção','wa'],economia:['Abaixo do previsto','in'],ok:['No previsto','ok'],sem:['Sem movimento','in']};
function tela(){const ids=Object.keys(CONDOS);if(!ids.length||!ROWS.length){$('app').innerHTML='<div class="card login" style="text-align:center"><img src="assets/play_icone_texto_petroleo.png" style="height:48px"><h2 style="margin-top:12px">Painel em preparação</h2><div class="hint">As informações do seu condomínio ficarão disponíveis após a liberação oficial pela FRZ.</div></div>';return}
  const c=SEL;const I=get(c,'indicadores'),O=get(c,'orcamento'),A=get(c,'acompanhamento'),G=get(c,'gestao'),X=get(c,'fluxo_caixa');let h='';
  if(ids.length>1){h+=`<div class="card"><b>Carteira</b> <select onchange="SEL=this.value;tela()">${ids.map(i=>`<option value="${i}" ${i===c?'selected':''}>${esc(CONDOS[i])}</option>`).join('')}</select>
    <table style="margin-top:10px"><tr><th>Condomínio</th><th class="r">Saldo em contas</th><th class="r">Execução 2026</th><th class="r">Custo mensal 2027</th><th class="r">Reajuste aprovado</th><th class="r">Pendências abertas</th></tr>${ids.map(i=>{const a=get(i,'indicadores'),o=get(i,'orcamento'),g=get(i,'gestao');return `<tr><td>${esc(CONDOS[i])}</td><td class="r">${a?m2(a.dados.saldoContas):'–'}</td><td class="r">${a?pc(a.dados.execucao):'–'}</td><td class="r">${a?m2(a.dados.custoProjetado2027):'–'}</td><td class="r">${o?pc(o.dados.cenarios[o.dados.cenario].reajuste):'–'}</td><td class="r">${g?g.dados.pendencias.abertas:'–'}</td></tr>`}).join('')}</table></div>`}
  h+=`<div class="card"><h2>${esc(CONDOS[c])}</h2><div class="hint">Atualizado em ${I?new Date(I.publicado_em).toLocaleString('pt-BR'):'–'}. Informações publicadas pela administração FRZ.</div></div>`;
  if(I){const d=I.dados;h+=`<div class="g4"><div class="card"><div class="kl">Saldo em contas</div><div class="kv">${m2(d.saldoContas)}</div><div class="ks">fim do mês ${d.mesRef}/2026</div></div><div class="card"><div class="kl">Execução do orçamento 2026</div><div class="kv">${pc(d.execucao)}</div><div class="ks">realizado sobre o previsto no ano</div></div><div class="card"><div class="kl">Fundo de reserva</div><div class="kv">${d.fundoReservaSegregado==null?'não segregado':m2(d.fundoReservaSegregado)}</div><div class="ks">separado do caixa livre (${m2(d.caixaLivre)})</div></div><div class="card"><div class="kl">Custo mensal projetado 2027</div><div class="kv">${m2(d.custoProjetado2027)}</div><div class="ks">despesa média 2026: ${m2(d.despesaMediaMes)}</div></div></div>`}
  if(O){const d=O.dados;const k=d.cenario;h+=`<div class="card"><h2>Orçamento 2027 ${d.versao==='aplicado'?'aplicado':'aprovado em assembleia'} (${new Date(d.data+'T12:00').toLocaleDateString('pt-BR')})</h2><div class="g3">${['atual','tecnico','sugerido'].map(x=>{const ce=d.cenarios[x],eq=d.equilibrio[x];if(!ce)return '';return `<div class="card" style="margin:0;${x===k?'border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)':''}"><div class="kl">${{atual:'Sem reajuste',tecnico:'Técnico',sugerido:'Simulado pela gestão'}[x]}${x===k?' · aprovado':''}</div><div class="kv">${m2(ce.arrecMedia)}</div><div class="ks">reajuste ${pc(ce.reajuste)} · resultado ${m2(eq.resultado)}/mês</div></div>`}).join('')}</div></div>`}
  else h+='<div class="card hint">Orçamento 2027 ainda não publicado (publicado após a aprovação em assembleia).</div>';
  if(A){const d=A.dados;h+=`<div class="card"><h2>Previsto × realizado ${d.exercicio} (até o mês ${d.ate})</h2><div class="hint">Despesas: previsto ${m2(d.totais.despesas.prevAc)} · realizado ${m2(d.totais.despesas.realAc)} · resultado acumulado ${m2(d.totais.resultadoAc)}</div><table style="margin-top:8px"><tr><th>Rubrica</th><th class="r">Previsto</th><th class="r">Realizado</th><th class="r">Diferença</th><th class="r">%</th><th>Situação</th></tr>${d.rubricas.map(r=>`<tr><td>${esc(r.rubrica)}</td><td class="r">${m2(r.previsto)}</td><td class="r">${m2(r.realizado)}</td><td class="r ${r.diferenca>0?'neg':'pos'}">${m2(r.diferenca)}</td><td class="r">${pc(r.diferencaPct)}</td><td><span class="chip ${(st[r.situacao]||st.sem)[1]}">${(st[r.situacao]||st.sem)[0]}</span></td></tr>`).join('')}</table><div class="hint" style="margin-top:6px">Valor abaixo do previsto pode ser despesa ainda não executada.</div></div>`}
  if(X){const d=X.dados;h+=`<div class="card"><h2>Fluxo de caixa projetado</h2><table><tr><th>Cenário</th><th class="r">Resultado médio/mês</th><th class="r">Caixa no fim</th><th class="r">Menor saldo</th><th>Fica negativo em</th><th class="r">Fundo de reserva no fim</th></tr>${Object.values(d.cenarios).map(x=>`<tr><td>${esc(x.nome)}</td><td class="r">${m2(x.resultadoMedio)}</td><td class="r">${m2(x.opFim)}</td><td class="r">${m2(x.minimo)}</td><td>${x.negativoEm||'–'}</td><td class="r">${m2(x.reservaFim)}</td></tr>`).join('')}</table><div class="hint" style="margin-top:6px">${esc(d.premissas)}</div></div>`}
  if(G){const d=G.dados;h+=`<div class="g4"><div class="card"><div class="kl">Inspeções mensais da gerência</div><div class="kv">${d.inspecoes.realizadas} de ${d.inspecoes.previstas}</div><div class="ks">${d.inspecoes.pendentes} pendente(s)</div></div><div class="card"><div class="kl">Pendências das inspeções</div><div class="kv">${d.pendencias.abertas} abertas</div><div class="ks">${d.pendencias.resolvidas} resolvidas · ${d.pendencias.atrasadas} em atraso</div></div><div class="card"><div class="kl">Manutenções atrasadas</div><div class="kv ${d.atrasadas?'neg':''}">${d.atrasadas}</div><div class="ks">de ${d.atividades} atividades ativas</div></div><div class="card"><div class="kl">Vencem em 30 dias</div><div class="kv">${d.proximas30}</div><div class="ks">programadas</div></div></div>`}
  const Hs=get(c,'historico');if(Hs){const d=Hs.dados;const M=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];h+=`<div class="card"><h2>Histórico</h2><table><tr><th>Mês</th><th class="r">2025 · receitas</th><th class="r">2025 · despesas</th><th class="r">2026 · entradas (sem fundo)</th><th class="r">2026 · saídas</th><th class="r">2026 · saldo em contas</th></tr>${M.slice(1).map((n,i)=>{const a=(d.ano2025||[]).find(x=>x.mes===i+1),b=(d.ano2026||[]).find(x=>x.mes===i+1);return `<tr><td>${n}</td><td class="r">${a?m2(a.receitas):'–'}</td><td class="r">${a?m2(a.despesas):'–'}</td><td class="r">${b?m2(b.entradas):'–'}</td><td class="r">${b?m2(b.saidas):'–'}</td><td class="r">${b?m2(b.saldo):'–'}</td></tr>`}).join('')}</table><div class="hint" style="margin-top:6px">${esc(d.obs)}</div></div>`}
  $('app').innerHTML=h}
login();
</script></body></html>
